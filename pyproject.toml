[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldsense"
version = "0.1.0"
description = "Field-level crop rotation decision support from NASA Earth observations"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["pandas>=1.5", "numpy>=1.23", "requests>=2.28", "matplotlib>=3.6"]

[project.optional-dependencies]
hls = ["rasterio>=1.3", "shapely>=2.0", "pyproj>=3.4", "earthaccess>=0.9"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
